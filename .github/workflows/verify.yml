name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: python3 -m pip install clang-format==23.1.1
      - run: python3 tools/oi_taxonomy.py
      - run: git diff --exit-code -- docs/oi-taxonomy.json docs/OI-TAXONOMY.md
      - run: tools/format.sh --check
      - run: python3 tests/usage_examples.py
      - run: python3 tools/usage_examples.py
      - run: git diff --exit-code -- docs/usage-coverage.json docs/USAGE-COVERAGE.md verification/usage-examples.json
      - run: tools/test.sh
      - run: SANITIZE=1 tools/test.sh
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils latexmk texlive-xetex texlive-lang-chinese texlive-latex-extra
      - run: python3 -m pip install pypdf==6.0.0
      - run: tools/build_pdf.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xcpc-handbook
          path: output/pdf/*.pdf
